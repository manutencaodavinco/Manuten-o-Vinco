<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <meta name="theme-color" content="#054537">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <title>Manutenção Vinco</title>

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #054537;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      color: #ffffff;
    }

    .carregando {
      text-align: center;
      padding: 24px;
    }

    .carregando img {
      width: 110px;
      height: 110px;
      object-fit: contain;
      border-radius: 24px;
      margin-bottom: 18px;
    }

    .carregando h1 {
      margin: 0 0 8px;
      font-size: 25px;
    }

    .carregando p {
      margin: 0;
      font-size: 15px;
      opacity: 0.85;
    }
  </style>

  <script>
    const URL_VMAN =
      'https://script.google.com/macros/s/AKfycbzhMF601pJHvzDXX8H5pqNNByFTR3352drAIr-1QuawppMRvto1v4CVLkqi2c4enPd2kQ/exec';

    /*
     * Abre diretamente o V-MAN.
     * replace() evita que o usuário volte
     * para esta tela usando o botão Voltar.
     */
    window.location.replace(URL_VMAN);
  </script>
</head>

<body>

  <div class="carregando">
    <img src="icon-512.png" alt="V-MAN">

    <h1>Manutenção Vinco</h1>

    <p>Abrindo sistema...</p>
  </div>

  <script>
    /*
     * Mantém o PWA registrado.
     */
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker
          .register('./service-worker.js')
          .catch(function(erro) {
            console.log(
              'Service Worker não registrado:',
              erro
            );
          });
      });
    }
  </script>

</body>
</html>
